<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The Omarchy shell (bar, menus, notifications, OSD) only asks for
     "monospace" (Style.qml). For that one program (quickshell), put SF Pro
     first, so the UI uses Apple's system font while terminals and code stay
     monospace. Runs after 50-user.conf, i.e. after `omarchy font set`'s
     ~/.config/fontconfig/fonts.conf. Nerd Font icons come from the fallbacks. -->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>SF Mono</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>SF Pro</string></edit>
  </match>
</fontconfig>

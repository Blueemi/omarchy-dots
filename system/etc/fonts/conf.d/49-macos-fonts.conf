<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- macOS fonts system-wide (blueemi, 2026-11-08). Runs just BEFORE
     50-omarchy.conf, which assigns sans-serif/system-ui/-apple-system to
     Liberation Sans and monospace to JetBrainsMono Nerd Font. Prepending here
     puts Apple's fonts first; Omarchy's picks stay behind them as fallbacks
     (so Nerd Font icons keep working). Remove this file to undo. The Omarchy shell's SF Pro rule is in
     52-omarchy-shell-sf-pro.conf (it must run after the user's fonts.conf). -->
<fontconfig>
  <!-- UI / proportional text: SF Pro -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
  <!-- code / terminals: SF Mono -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
</fontconfig>

# Omarchy: Cmd is plain Super (Omarchy's own shortcuts are Super-based,
# e.g. Super+C / Super+V copy/paste, Super+Space launcher).
# The previous macOS-style "Cmd acts like Ctrl" GNOME config is saved next to
# this file as default.conf.gnome-mac-*.
[ids]
*

[main]
# Fn sends F19, a key nothing else uses, so apps such as Hex can bind it
fn = f19

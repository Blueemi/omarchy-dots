# Read by /usr/bin/helium-browser at every launch. Fully quit Helium to apply.
# Change the factor with:  scroll-speed helium 1.5
#
# WaylandUnscaledTouchpadScrolling: Chromium multiplies touchpad scroll on
#   Wayland by 12x by default. This uses scroll_scaling_factor instead
#   (1 = same as GNOME apps; higher = faster).
# ExperimentalFlingAnimation: physics-based momentum curve (longer glides).
--enable-features=WaylandUnscaledTouchpadScrolling:scroll_scaling_factor/1,ExperimentalFlingAnimation
